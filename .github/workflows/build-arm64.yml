name: Build Percona XtraBackup for ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'XtraBackup version tag (e.g., percona-xtrabackup-8.0.35-35)'
        required: true
        default: 'percona-xtrabackup-8.0.35-35'

env:
  XTRABACKUP_VERSION: ${{ inputs.version || 'percona-xtrabackup-8.0.35-35' }}
  BASE_IMAGE: hxsoong/kylin:v10-sp3

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.XTRABACKUP_VERSION }}
          fetch-depth: 0

      - name: Display version and system info
        run: |
          echo "=== Build Information ==="
          echo "Building Percona XtraBackup version: ${{ env.XTRABACKUP_VERSION }}"
          echo "Git tag/commit: $(git describe --tags --always)"
          echo ""
          echo "=== System Information ==="
          uname -a
          echo ""
          echo "=== CPU Architecture ==="
          arch
          lscpu | grep -E "Architecture|CPU\(s\)|Model name"
          echo ""
          echo "=== XB_VERSION ==="
          cat XB_VERSION

      - name: Set up Docker
        run: |
          # Docker 应该已经预装在 ARM64 runner 上
          docker version

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar
          key: docker-image-${{ env.BASE_IMAGE }}
          restore-keys: |
            docker-image-

      - name: Pull base image
        run: |
          echo "Checking for cached Docker image: ${{ env.BASE_IMAGE }}"

          if [ -f /tmp/docker-image.tar ]; then
            echo "Loading Docker image from cache..."
            docker load -i /tmp/docker-image.tar || {
              echo "Cache load failed, pulling from registry..."
              docker pull ${{ env.BASE_IMAGE }}
            }
          else
            echo "No cache found, pulling base image: ${{ env.BASE_IMAGE }}"
            docker pull ${{ env.BASE_IMAGE }}

            echo "Saving Docker image to cache..."
            docker save ${{ env.BASE_IMAGE }} -o /tmp/docker-image.tar
          fi

          echo "Verifying Docker image..."
          docker images | grep percona-xtrabackup || docker images | grep -E "kylin|BASE_IMAGE"

      - name: Create build container
        run: |
          docker create --name xtrabackup-builder \
            -v ${{ github.workspace }}:/workspace/percona-xtrabackup \
            -v /tmp/yum-cache:/tmp/yum-cache \
            ${{ env.BASE_IMAGE }} \
            sleep infinity

          docker start xtrabackup-builder

      - name: Cache yum packages
        uses: actions/cache@v4
        with:
          path: /tmp/yum-cache
          key: yum-cache-${{ env.BASE_IMAGE }}
          restore-keys: |
            yum-cache-

      - name: Cache Boost library
        uses: actions/cache@v4
        with:
          path: /workspace/boost
          key: boost-cache-1.77.0

      - name: Install build dependencies in container
        run: |
          docker exec xtrabackup-builder bash -c '
            set -e
            echo "=== Setting up yum cache ==="
            mkdir -p /tmp/yum-cache
            echo "keepcache=1" >> /etc/yum.conf

            echo "=== Updating package lists ==="
            yum makecache --timer

            echo "=== Installing build dependencies ==="
            yum install -y \
              gcc \
              gcc-c++ \
              cmake \
              make \
              bison \
              libaio \
              libaio-devel \
              automake \
              autoconf \
              libtool \
              ncurses-devel \
              libgcrypt-devel \
              libev-devel \
              libcurl-devel \
              zlib-devel \
              openssl-devel \
              zstd \
              vim-common \
              procps-ng-devel \
              git \
              perl \
              perl-JSON \
              perl-Time-HiRes \
              diffutils

            echo "=== Verifying installations ==="
            gcc --version
            cmake --version
            make --version
          '

      - name: Build Percona XtraBackup in container
        run: |
          docker exec xtrabackup-builder bash -c '
            set -e
            cd /workspace/percona-xtrabackup

            echo "=== Fixing git ownership and safe directory ==="
            git config --global --add safe.directory "*"

            echo "=== Initializing git submodules ==="
            git submodule update --init --recursive

            echo "=== Disabling ABI check for cross-platform build ==="
            # Follow Homebrew approach: disable ABI check on Linux
            # This prevents build failures when compiling on different platforms
            sed -i.bak "s/SET(RUN_ABI_CHECK 1)/SET(RUN_ABI_CHECK 0)/" cmake/abi_check.cmake

            echo "=== Creating build directory ==="
            mkdir -p build
            cd build

            echo "=== Installing GCC Toolset 11 from Rocky Linux 8 ==="
            # Install SCL utilities
            yum install -y scl-utils scl-utils-build

            # Add ONLY Rocky Linux 8 AppStream repo (contains gcc-toolset-11)
            # Skip BaseOS to avoid conflicts with Kylin packages
            printf "[rocky8-appstream]\\nname=Rocky Linux 8 AppStream\\nbaseurl=https://dl.rockylinux.org/pub/rocky/8/AppStream/aarch64/os/\\nenabled=1\\ngpgcheck=0\\npriority=1\\n" > /etc/yum.repos.d/rocky8-appstream.repo

            # Add Rocky Linux 8 Devel repo
            printf "[rocky8-devel]\\nname=Rocky Linux 8 Devel\\nbaseurl=https://dl.rockylinux.org/pub/rocky/8/Devel/aarch64/os/\\nenabled=1\\ngpgcheck=0\\npriority=1\\n" > /etc/yum.repos.d/rocky8-devel.repo

            # Clean and rebuild cache
            yum clean all
            yum makecache

            # Install GCC Toolset 11 with --allowerasing to resolve conflicts
            yum install -y --allowerasing gcc-toolset-11-gcc gcc-toolset-11-gcc-c++

            echo "=== Enabling GCC 11 ==="
            source /opt/rh/gcc-toolset-11/enable

            echo "=== Verifying GCC version ==="
            gcc -v

            echo "=== Running CMake configuration ==="
            cmake -DWITH_BOOST=/workspace/boost \
                  -DDOWNLOAD_BOOST=ON \
                  -DBUILD_CONFIG=xtrabackup_release \
                  -DWITH_MAN_PAGES=OFF \
                  -S .. -B .

            echo "=== Building with make (using all CPU cores) ==="
            make -j$(nproc)

            echo "=== Checking build output ==="
            echo "Looking for xtrabackup binary in common locations..."
            find . -name "xtrabackup" -type f 2>/dev/null | head -5
            ls -lah runtime_output_directory/ 2>/dev/null || echo "runtime_output_directory not found"
            ls -lah storage/innobase/xtrabackup/xtrabackup 2>/dev/null || echo "storage/innobase/xtrabackup/xtrabackup not found"

            echo "=== Build completed successfully ==="
          '

      - name: Prepare package
        run: |
          docker exec xtrabackup-builder bash -c '
            set -e
            cd /workspace/percona-xtrabackup/build

            echo "=== Installing to staging directory ==="
            make install DESTDIR=/workspace/staging

            echo "=== Creating tar.gz package ==="
            cd /workspace

            # Extract version from XB_VERSION file
            source /workspace/percona-xtrabackup/XB_VERSION
            VERSION="${XB_VERSION_MAJOR}.${XB_VERSION_MINOR}.${XB_VERSION_PATCH}${XB_VERSION_EXTRA}"
            PACKAGE_NAME="percona-xtrabackup-${VERSION}-linux-arm64"

            # Create package directory
            mkdir -p "${PACKAGE_NAME}"

            # Copy installed files
            cp -r staging/usr/local/xtrabackup/* "${PACKAGE_NAME}/"

            # Create tar.gz
            tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

            # Calculate checksums
            sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
            md5sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.md5"

            echo "=== Package contents ==="
            ls -lah "${PACKAGE_NAME}/"

            echo "=== Package files ==="
            ls -lah /workspace/*.tar.gz*
          '

      - name: Copy artifacts from container
        run: |
          docker cp xtrabackup-builder:/workspace/*.tar.gz ${{ github.workspace }}/
          docker cp xtrabackup-builder:/workspace/*.tar.gz.sha256 ${{ github.workspace }}/
          docker cp xtrabackup-builder:/workspace/*.tar.gz.md5 ${{ github.workspace }}/

      - name: Display build artifacts
        run: |
          echo "=== Build Artifacts ==="
          ls -lah *.tar.gz*
          echo ""
          echo "=== SHA256 Checksum ==="
          cat *.sha256
          echo ""
          echo "=== MD5 Checksum ==="
          cat *.md5
          echo ""
          echo "=== Binary architecture ==="
          tar -xzf percona-xtrabackup-*-linux-arm64.tar.gz --to-stdout \
            percona-xtrabackup-*-linux-arm64/bin/xtrabackup | file -

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: percona-xtrabackup-${{ env.XTRABACKUP_VERSION }}-linux-arm64
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.tar.gz.md5
          retention-days: 90

      - name: Create Release Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # Percona XtraBackup Build Summary

          ## Build Information
          - **Version**: ${{ env.XTRABACKUP_VERSION }}
          - **Base Image**: ${{ env.BASE_IMAGE }}
          - **Target Architecture**: linux/arm64
          - **Runner**: ubuntu-24.04-arm
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Artifacts
          The following packages have been created:

          | File | Size |
          |------|------|
          $(ls -lh *.tar.gz | awk "{print "| **"$9"** | "$5" |}") |
          $(ls -lh *.tar.gz.sha256 | awk "{print "| **"$9"** | "$5" |}") |
          $(ls -lh *.tar.gz.md5 | awk "{print "| **"$9"** | "$5" |}") |

          ## Checksums
          \`\`\`
          $(cat *.sha256)
          \`\`\`

          ## Download
          Artifacts are available in the Actions artifacts section.
          EOF

      - name: Cleanup
        if: always()
        run: |
          docker stop xtrabackup-builder || true
          docker rm xtrabackup-builder || true
